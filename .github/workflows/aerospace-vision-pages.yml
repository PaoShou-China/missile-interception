name: Deploy Aerospace Vision Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "aerospace-vision-web/**"
      - "interceptor-vision/**"
      - ".github/workflows/aerospace-vision-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-aerospace-vision
  cancel-in-progress: true

defaults:
  run:
    working-directory: aerospace-vision-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aerospace-vision-web/package-lock.json
      - run: npm ci
      - name: Unit and scientific tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Stage shared assets
        run: |
          cp -r ../assets dist/
          test -d dist/assets
      - name: Install interceptor vision dependencies
        working-directory: interceptor-vision
        run: npm ci
      - name: Build interceptor vision
        working-directory: interceptor-vision
        run: npm run build
      - name: Stage interceptor vision under /interceptor-vision/
        run: |
          mkdir -p dist/interceptor-vision
          cp -r ../interceptor-vision/dist/. dist/interceptor-vision/
          test -f dist/interceptor-vision/index.html
          test -f dist/interceptor-vision/assets/interceptor-lod0.glb
          test -f dist/interceptor-vision/renders/manifest.json
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Mesa software GL (Firefox)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - name: Browser E2E (Chromium + WebKit, deployment gate)
        run: npx playwright test --project=chromium --project=webkit
      - name: Firefox E2E (software GL, informational)
        continue-on-error: true
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: npx playwright test --project=firefox
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: aerospace-vision-web/test-results
          retention-days: 7
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aerospace-vision-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
