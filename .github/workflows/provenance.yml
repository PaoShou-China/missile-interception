name: Provenance tooling

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/provenance.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-provenance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tooling test dependency
        run: python -m pip install pytest==8.3.5
      - name: Check generic tooling syntax
        run: python -m compileall -q tools
      - name: Test generic provenance tools only
        run: python -m pytest -q tests
      - name: Capture CI environment inventory
        run: python tools/environment_snapshot.py --output environment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-${{ matrix.os }}-${{ matrix.python }}
          path: environment.json
          if-no-files-found: ignore
