<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#060a11"/><stop offset="0.65" stop-color="#04070c"/>
    <stop offset="1" stop-color="#020408"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.62" cy="0.42" r="0.5">
    <stop offset="0" stop-color="#3f8fd8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#3f8fd8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9f1f9"/>
    <stop offset="0.34" stop-color="#b9c6d4"/>
    <stop offset="0.62" stop-color="#7e8b9a"/>
    <stop offset="1" stop-color="#333c47"/>
  </linearGradient>
  <linearGradient id="fin" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#55606d"/><stop offset="1" stop-color="#b9c9da"/>
  </linearGradient>
  <linearGradient id="finb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4d5763"/><stop offset="1" stop-color="#1b222a"/>
  </linearGradient>
  <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff3d8" stop-opacity="0.92"/>
    <stop offset="0.35" stop-color="#ffc878" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a2949"/><stop offset="1" stop-color="#04101c"/>
  </linearGradient>
  <filter id="bM" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="bS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7fd4ff" stroke-opacity="0.045"/>
  </pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<rect width="1600" height="900" fill="url(#glow)"/>

<!-- earth limb -->
<circle cx="1240" cy="1560" r="760" fill="url(#earth)"/>
<circle cx="1240" cy="1560" r="760" fill="none" stroke="#8ad8ff" stroke-opacity="0.42" stroke-width="2"/>
<circle cx="1240" cy="1560" r="760" fill="none" stroke="#4fb3ff" stroke-opacity="0.22" stroke-width="18" filter="url(#bM)"/>

<!-- corner ticks -->
<g stroke="#7fd4ff" stroke-opacity="0.22" stroke-width="1.2">
  <path d="M60 60h34M60 60v34M1540 60h-34M1540 60v34M60 840v-34M60 840h34M1540 840v-34M1540 840h-34"/>
</g>

<!-- stars and trajectory -->
<g fill="#ffffff">
  <circle cx="180" cy="150" r="1.3" opacity=".45"/><circle cx="360" cy="96" r="1" opacity=".3"/>
  <circle cx="520" cy="170" r="1.1" opacity=".38"/><circle cx="700" cy="110" r="1.4" opacity=".42"/>
  <circle cx="900" cy="160" r="1" opacity=".3"/><circle cx="1080" cy="90" r="1.2" opacity=".35"/>
  <circle cx="1240" cy="150" r="1.3" opacity=".4"/><circle cx="1420" cy="110" r="1" opacity=".28"/>
  <circle cx="240" cy="230" r="1" opacity=".26"/><circle cx="460" cy="260" r="1.1" opacity=".3"/>
  <circle cx="640" cy="220" r="1" opacity=".24"/><circle cx="840" cy="250" r="1.2" opacity=".28"/>
</g>

<!-- plume -->
<path d="M 1013.7 414.0 C 1083.7 396.0, 1143.7 418.0, 1209.7 430.0
         C 1143.7 442.0, 1083.7 464.0, 1013.7 446.0 Z" fill="url(#plume)"/>
<ellipse cx="1043.7" cy="430.0" rx="70" ry="20" fill="#ff9a4d" opacity="0.25" filter="url(#bM)"/>

<!-- lifting surfaces (horizontal pair, plan view) -->
<polygon points="679.3,402.3 1013.7,402.3 1013.7,370.2 872.9,370.2" fill="url(#fin)" stroke="#39434e" stroke-width="1.2"/>
<polygon points="679.3,457.7 1013.7,457.7 1013.7,489.8 872.9,489.8" fill="url(#fin)" stroke="#39434e" stroke-width="1.2"/>

<!-- body -->
