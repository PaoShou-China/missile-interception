<path d="M 300.0 430.0 300.0 430.0 L 305.5 423.1 L 311.0 420.4 L 316.5 418.3 L 322.0 416.6 L 327.5 415.1 L 333.0 413.8 L 338.5 412.7 L 344.0 411.7 L 349.5 410.7 L 355.0 409.9 L 360.5 409.1 L 366.0 408.4 L 371.5 407.7 L 377.0 407.1 L 382.5 406.5 L 388.0 406.0 L 393.5 405.5 L 399.0 405.1 L 404.5 404.7 L 410.0 404.3 L 415.5 404.0 L 421.0 403.7 L 426.5 403.4 L 432.0 403.2 L 437.5 403.0 L 443.0 402.8 L 448.5 402.6 L 454.0 402.5 L 459.5 402.4 L 465.0 402.3 L 470.5 402.3 L 476.0 402.3 L 1013.7 402.3 L 1013.7 457.7 476.0 457.7 476.0 457.7 L 470.5 457.7 L 465.0 457.7 L 459.5 457.6 L 454.0 457.5 L 448.5 457.4 L 443.0 457.2 L 437.5 457.0 L 432.0 456.8 L 426.5 456.6 L 421.0 456.3 L 415.5 456.0 L 410.0 455.7 L 404.5 455.3 L 399.0 454.9 L 393.5 454.5 L 388.0 454.0 L 382.5 453.5 L 377.0 452.9 L 371.5 452.3 L 366.0 451.6 L 360.5 450.9 L 355.0 450.1 L 349.5 449.3 L 344.0 448.3 L 338.5 447.3 L 333.0 446.2 L 327.5 444.9 L 322.0 443.4 L 316.5 441.7 L 311.0 439.6 L 305.5 436.9 L 300.0 430.0 Z" fill="none" stroke="#bfe9ff" stroke-opacity="0.55" stroke-width="1.6" filter="url(#bS)"/>

<!-- panel lines -->
<g stroke="#26303a" stroke-opacity="0.5" stroke-width="1.2">
  <path d="M 476.0 402.3 L 476.0 457.7"/>
  <path d="M 568.4 403.3 L 568.4 456.7"/>
  <path d="M 679.3 404.3 L 679.3 455.7"/>
  <path d="M 964.4 405.3 L 964.4 454.7"/>
</g>

<!-- nozzle -->
<ellipse cx="1013.7" cy="430.0" rx="10" ry="26.7" fill="#111820" stroke="#3b4550"/>
<ellipse cx="1013.7" cy="430.0" rx="5" ry="18.7" fill="#ffd9a0" opacity="0.85"/>

<!-- length dimension -->
<g stroke="#5f7d95" stroke-opacity="0.8" stroke-width="1" fill="#8ea3b8"
   font-family="'SF Mono',Consolas,monospace" font-size="14">
  <path d="M 300.0 560 L 1013.7 560"/>
  <path d="M 300.0 552 L 300.0 568 M 1013.7 552 L 1013.7 568"/>
  <text x="656.8" y="586" text-anchor="middle">8.11 m</text>
</g>
<g stroke="#5f7d95" stroke-opacity="0.7" stroke-width="1" fill="#8ea3b8"
   font-family="'SF Mono',Consolas,monospace" font-size="13">
  <path d="M 679.3 612 L 1013.7 612"/>
  <path d="M 679.3 604 L 679.3 620 M 1013.7 604 L 1013.7 620"/>
  <text x="846.5" y="638" text-anchor="middle">root chord 3.8 m</text>
  <path d="M 872.9 352.2 L 1013.7 352.2"/>
  <path d="M 872.9 344.2 L 872.9 360.2
           M 1013.7 344.2 L 1013.7 360.2"/>
  <text x="943.3" y="336.2" text-anchor="middle">tip chord 1.6 m</text>
</g>

<!-- section marker A-A -->
<g stroke="#7fd4ff" stroke-opacity="0.5" stroke-dasharray="6 5" stroke-width="1">
  <path d="M 933.6 324.2 L 933.6 535.8"/>
</g>
<g font-family="'SF Mono',Consolas,monospace" font-size="13" fill="#7fd4ff" fill-opacity="0.8">
  <text x="941.6" y="318.2">A</text>
  <text x="941.6" y="549.8">A</text>
</g>

<!-- front view -->
<g>
  <g fill="#c9d6e4" stroke="#39434e" stroke-width="1.2">
    <path d="M 1341.0 352.8 L 1359.0 352.8 L 1355.0 298.1 L 1345.0 298.1 Z"/>
    <path d="M 1341.0 447.2 L 1359.0 447.2 L 1355.0 501.9 L 1345.0 501.9 Z"/>
    <path d="M 1302.8 391.0 L 1302.8 409.0 L 1248.2 405.0 L 1248.2 395.0 Z"/>
    <path d="M 1397.2 391.0 L 1397.2 409.0 L 1451.8 405.0 L 1451.8 395.0 Z"/>
  </g>
  <circle cx="1350.0" cy="400.0" r="47.2" fill="#0c1219" stroke="#93a4b6" stroke-opacity="0.85" stroke-width="1.6"/>
  <circle cx="1350.0" cy="400.0" r="47.2" fill="none" stroke="#7fd4ff" stroke-opacity="0.25" stroke-width="4" filter="url(#bS)"/>
  <text x="1350.0" y="274.1" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
        font-size="13" letter-spacing="2.4" fill="#9fb2c6">SECTION A-A</text>
  <text x="1350.0" y="535.9" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
        font-size="11.5" letter-spacing="1.6" fill="#6f8296">4 × FINS · 90° CRUCIFORM</text>
</g>

<!-- callouts -->
<g font-family="'SF Mono',Consolas,monospace" fill="#9fb2c6" font-size="14" letter-spacing="1.6">
  <path d="M 250 300 L 420 300 L 379.2 416.0" fill="none" stroke="#7fd4ff" stroke-opacity="0.35"/>
  <text x="96" y="294">TANGENT-OGIVE NOSE</text>
  <text x="96" y="316" fill="#6f8296" font-size="11.5">2.0 m ogive · Ø 0.63 m body</text>

  <path d="M 1180 200 L 1080 200 L 1003.7 384.2" fill="none" stroke="#7fd4ff" stroke-opacity="0.35"/>
  <text x="1194" y="194">4 × CRUCIFORM FINS</text>
  <text x="1194" y="216" fill="#6f8296" font-size="11.5">same station · root 3.8 m · span 0.36 m/side</text>
  <text x="1194" y="236" fill="#6f8296" font-size="11.5">double duty as low-aspect-ratio lifting surfaces</text>
</g>

<!-- title block -->
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <text x="96" y="712" font-size="13" letter-spacing="3" fill="#6f8296" font-family="'SF Mono',Consolas,monospace">GENERAL ARRANGEMENT</text>
  <text x="96" y="754" font-size="30" font-weight="700" fill="#eef4fa" letter-spacing="-0.5">2000 km-class hypersonic interceptor</text>
  <text x="96" y="784" font-size="14" fill="#8ea3b8" font-family="'SF Mono',Consolas,monospace">6DOF simulation model · cruciform fins · lifting body</text>
</g>
<text x="1500" y="846" text-anchor="end" font-family="'SF Mono',Consolas,monospace"
      font-size="13" letter-spacing="1.6" fill="#5f7d95">L 8.11 m · Ø 0.63 m · m0 2565 kg</text>
</svg>
